name: Deploy EduLock Supabase backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'

permissions:
  contents: read

# Serialize schema pushes so two commits cannot apply the same migration concurrently.
concurrency:
  group: edulock-supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: edulock-supabase
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.98.2

      - name: Link EduLock project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --yes --include-all

      - name: Deploy child pairing code function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy create-child-pairing-code --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Deploy child pairing claim function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy claim-child-pairing --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Deploy secure child emergency access function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy child-emergency-access --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Deploy task submission function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy submit-task-attempt --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Deploy automatic daily task function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ensure-daily-tasks --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Deploy reward bank redemption function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy redeem-child-reward --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Deploy curriculum library function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy curriculum-library --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Deploy curriculum import function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy import-curriculum-questions --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
