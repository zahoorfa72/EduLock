name: Android build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Persist a single debug certificate across hosted-runner instances.
      - name: Restore stable debug signing key
        id: debug-keystore-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: edulock-stable-debug-keystore-v1
      - name: Generate stable debug signing key on first build
        if: steps.debug-keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -storetype JKS \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=EduLock,C=PK" \
            -keyalg RSA -keysize 2048 -validity 10000
      - name: Cache stable debug signing key
        if: steps.debug-keystore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: edulock-stable-debug-keystore-v1
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle assembleDebug
      - name: Verify APK signature matches the persisted debug key
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.android/debug.keystore"
          shopt -s nullglob
          APKS=(app/build/outputs/apk/debug/*.apk)
          test "${#APKS[@]}" -gt 0
          KEY_SHA="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | openssl dgst -sha256 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          for APK in "${APKS[@]}"; do
            echo "Checking $(basename "$APK") ($(du -h "$APK" | cut -f1))"
            CERT_REPORT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
            echo "$CERT_REPORT"
            APK_SHA="$(printf '%s\n' "$CERT_REPORT" | awk 'tolower($0) ~ /certificate sha-256 digest/ {print $NF; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            test -n "$KEY_SHA" && test -n "$APK_SHA"
            test "$KEY_SHA" = "$APK_SHA"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: EduLock-optimized-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
